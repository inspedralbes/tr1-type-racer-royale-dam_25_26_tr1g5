services:
  mysql:
    image: mysql:8.0
    container_name: fitcam-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fitcam
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: ./backend
    container_name: fitcam-api
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: fitcam
      BCRYPT_ROUNDS: 12
    ports:
      - "3000:3000"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:3000"
    container_name: fitcam-frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mysql_data:
